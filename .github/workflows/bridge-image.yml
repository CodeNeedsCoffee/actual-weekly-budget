# Tests the bridge and publishes its image, so the home server (and Tugtainer) can pull updates.
name: bridge-image
on:
  push:
    branches: [main]
    paths: ["bridge/**", ".github/workflows/bridge-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
        working-directory: bridge
      - run: npm test
        working-directory: bridge
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: bridge
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/codeneedscoffee/actual-weekly-budget-bridge:latest
            ghcr.io/codeneedscoffee/actual-weekly-budget-bridge:${{ github.sha }}
